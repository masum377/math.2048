<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>2048 Game</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:Arial, sans-serif;

    background:linear-gradient(135deg,#faf8ef,#e8e1d5);

    color:#776e65;
}

.game{
    width:430px;
    max-width:94%;
}

/* HEADER */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:15px;
}

.title{
    font-size:70px;
    font-weight:bold;
    color:#776e65;
}

.scores{
    display:flex;
    gap:8px;
}

.score-box{
    background:#bbada0;
    color:white;

    min-width:80px;
    padding:8px 12px;

    border-radius:6px;

    text-align:center;
}

.score-box small{
    display:block;
    font-size:12px;
    font-weight:bold;
}

.score{
    font-size:22px;
    font-weight:bold;
}

/* TOP AREA */

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:15px;
}

.info{
    font-size:14px;
    line-height:1.5;
}

.new-game{
    border:none;

    padding:11px 16px;

    border-radius:6px;

    background:#8f7a66;
    color:white;

    font-weight:bold;

    cursor:pointer;
}

.new-game:hover{
    background:#776453;
}

/* BOARD */

.board{
    width:100%;
    aspect-ratio:1/1;

    background:#bbada0;

    padding:10px;

    border-radius:8px;

    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:10px;

    position:relative;

    touch-action:none;
}

.cell{
    background:#cdc1b4;

    border-radius:6px;

    display:flex;

    justify-content:center;
    align-items:center;

    font-size:35px;
    font-weight:bold;

    transition:.12s;
}

/* TILE COLORS */

.tile-2{
    background:#eee4da;
    color:#776e65;
}

.tile-4{
    background:#ede0c8;
    color:#776e65;
}

.tile-8{
    background:#f2b179;
    color:white;
}

.tile-16{
    background:#f59563;
    color:white;
}

.tile-32{
    background:#f67c5f;
    color:white;
}

.tile-64{
    background:#f65e3b;
    color:white;
}

.tile-128{
    background:#edcf72;
    color:white;
    font-size:30px;
}

.tile-256{
    background:#edcc61;
    color:white;
    font-size:30px;
}

.tile-512{
    background:#edc850;
    color:white;
    font-size:30px;
}

.tile-1024{
    background:#edc53f;
    color:white;
    font-size:25px;
}

.tile-2048{
    background:#edc22e;
    color:white;
    font-size:25px;

    box-shadow:0 0 20px rgba(255,193,7,.6);
}

/* MESSAGE */

.message{
    text-align:center;

    margin-top:18px;

    font-size:15px;
}

.win{
    color:#e67e22;
    font-weight:bold;
}

/* MOBILE */

@media(max-width:500px){

    .title{
        font-size:55px;
    }

    .score-box{
        min-width:65px;
    }

    .score{
        font-size:18px;
    }

    .cell{
        font-size:28px;
    }

}

</style>
</head>

<body>

<div class="game">

    <!-- HEADER -->

    <div class="header">

        <div class="title">
            2048
        </div>

        <div class="scores">

            <div class="score-box">
                <small>SCORE</small>
                <div class="score" id="score">
                    0
                </div>
            </div>

            <div class="score-box">
                <small>BEST</small>
                <div class="score" id="best">
                    0
                </div>
            </div>

        </div>

    </div>


    <!-- TOP -->

    <div class="top">

        <div class="info">
            Join the numbers and get to the
            <b>2048 tile!</b>
        </div>

        <button
            class="new-game"
            onclick="newGame()">

            New Game

        </button>

    </div>


    <!-- BOARD -->

    <div
        class="board"
        id="board">

    </div>


    <div
        class="message"
        id="message">

        Use
        <b>Arrow Keys</b>
        or swipe to play 🎮

    </div>

</div>


<script>

/* =========================
   GAME VARIABLES
========================= */

let board = [];
let score = 0;

let best =
    localStorage.getItem("2048-best") || 0;

let gameOver = false;
let won = false;


/* =========================
   START GAME
========================= */

function newGame(){

    board = Array(4)
        .fill()
        .map(() =>
            Array(4).fill(0)
        );

    score = 0;

    gameOver = false;
    won = false;

    document.getElementById("score")
        .innerText = score;

    document.getElementById("message")
        .innerHTML =
        'Use <b>Arrow Keys</b> or swipe to play 🎮';

    addRandomTile();
    addRandomTile();

    drawBoard();
}


/* =========================
   DRAW BOARD
========================= */

function drawBoard(){

    const boardElement =
        document.getElementById("board");

    boardElement.innerHTML = "";

    for(let r=0;r<4;r++){

        for(let c=0;c<4;c++){

            const cell =
                document.createElement("div");

            cell.classList.add("cell");

            const value =
                board[r][c];

            if(value !== 0){

                cell.innerText = value;

                cell.classList.add(
                    "tile-" + value
                );

            }

            boardElement.appendChild(cell);

        }

    }

    document.getElementById("score")
        .innerText = score;

    document.getElementById("best")
        .innerText = best;
}


/* =========================
   RANDOM TILE
========================= */

function addRandomTile(){

    let empty = [];

    for(let r=0;r<4;r++){

        for(let c=0;c<4;c++){

            if(board[r][c] === 0){

                empty.push({
                    r:r,
                    c:c
                });

            }

        }

    }

    if(empty.length === 0)
        return;

    const random =
        empty[
            Math.floor(
                Math.random()*empty.length
            )
        ];

    board[random.r][random.c] =
        Math.random() < 0.9 ? 2 : 4;
}


/* =========================
   MOVE
========================= */

function move(direction){

    if(gameOver)
        return;

    let oldBoard =
        JSON.stringify(board);

    if(direction === "left")
        moveLeft();

    if(direction === "right")
        moveRight();

    if(direction === "up")
        moveUp();

    if(direction === "down")
        moveDown();


    let changed =
        JSON.stringify(board)
        !== oldBoard;


    if(changed){

        addRandomTile();

        drawBoard();

        checkWin();

        if(!canMove()){

            gameOver = true;

            document.getElementById("message")
                .innerHTML =
                "😵 Game Over! <br> Click <b>New Game</b>";

        }

    }

}


/* =========================
   SLIDE ROW
========================= */

function slide(row){

    row =
        row.filter(
            value => value !== 0
        );

    for(let i=0;i<row.length-1;i++){

        if(row[i] === row[i+1]){

            row[i] *= 2;

            score += row[i];

            row.splice(i+1,1);

        }

    }

    while(row.length < 4){

        row.push(0);

    }

    return row;
}


/* =========================
   LEFT
========================= */

function moveLeft(){

    for(let r=0;r<4;r++){

        board[r] =
            slide(board[r]);

    }
}


/* =========================
   RIGHT
========================= */

function moveRight(){

    for(let r=0;r<4;r++){

        board[r] =
            slide(
                board[r].reverse()
            ).reverse();

    }
}


/* =========================
   UP
========================= */

function moveUp(){

    for(let c=0;c<4;c++){

        let column = [];

        for(let r=0;r<4;r++){

            column.push(
                board[r][c]
            );

        }

        column = slide(column);

        for(let r=0;r<4;r++){

            board[r][c] =
                column[r];

        }

    }
}


/* =========================
   DOWN
========================= */

function moveDown(){

    for(let c=0;c<4;c++){

        let column = [];

        for(let r=0;r<4;r++){

            column.push(
                board[r][c]
            );

        }

        column =
            slide(
                column.reverse()
            ).reverse();

        for(let r=0;r<4;r++){

            board[r][c] =
                column[r];

        }

    }
}


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    function(e){

        if([
            "ArrowLeft",
            "ArrowRight",
            "ArrowUp",
            "ArrowDown"
        ].includes(e.key)){

            e.preventDefault();

        }

        if(e.key === "ArrowLeft")
            move("left");

        if(e.key === "ArrowRight")
            move("right");

        if(e.key === "ArrowUp")
            move("up");

        if(e.key === "ArrowDown")
            move("down");

    }
);


/* =========================
   CHECK WIN
========================= */

function checkWin(){

    for(let r=0;r<4;r++){

        for(let c=0;c<4;c++){

            if(board[r][c] === 2048){

                if(!won){

                    won = true;

                    document.getElementById(
                        "message"
                    ).innerHTML =
                    "🎉 <span class='win'>You reached 2048!</span> 🎉";

                }

            }

        }

    }

}


/* =========================
   CHECK MOVES
========================= */

function canMove(){

    for(let r=0;r<4;r++){

        for(let c=0;c<4;c++){

            if(board[r][c] === 0)
                return true;

            if(
                c < 3 &&
                board[r][c] ===
                board[r][c+1]
            )
                return true;

            if(
                r < 3 &&
                board[r][c] ===
                board[r+1][c]
            )
                return true;

        }

    }

    return false;
}


/* =========================
   UPDATE BEST SCORE
========================= */

setInterval(function(){

    if(score > best){

        best = score;

        localStorage.setItem(
            "2048-best",
            best
        );

        document.getElementById(
            "best"
        ).innerText = best;

    }

},100);


/* =========================
   MOBILE SWIPE
========================= */

let startX = 0;
let startY = 0;

const gameBoard =
    document.getElementById("board");


gameBoard.addEventListener(
    "touchstart",
    function(e){

        startX =
            e.touches[0].clientX;

        startY =
            e.touches[0].clientY;

    }
);


gameBoard.addEventListener(
    "touchend",
    function(e){

        let endX =
            e.changedTouches[0].clientX;

        let endY =
            e.changedTouches[0].clientY;

        let dx = endX - startX;
        let dy = endY - startY;

        if(
            Math.abs(dx) <
            30 &&
            Math.abs(dy) <
            30
        )
            return;


        if(Math.abs(dx) > Math.abs(dy)){

            if(dx > 0)
                move("right");
            else
                move("left");

        }
        else{

            if(dy > 0)
                move("down");
            else
                move("up");

        }

    }
);


/* =========================
   START
========================= */

newGame();

</script>

</body>
</html>
